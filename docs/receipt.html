<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>付款收据</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; padding: 40px 16px; color: #1d2433; }
  .card { max-width: 520px; margin: 0 auto; background: #fff; border-radius: 10px; padding: 28px 32px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .meta { color: #6b7280; font-size: 14px; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { padding: 10px 0; border-bottom: 1px solid #e5e7eb; text-align: left; }
  th { color: #6b7280; font-weight: 500; font-size: 13px; }
  .total td { font-weight: 600; border-bottom: none; }
  .actions { margin-top: 24px; }
  .btn { display: inline-block; padding: 10px 18px; border-radius: 6px; background: #2563EB; color: #fff; text-decoration: none; font-size: 15px; }
  .btn:hover { background: #1D4ED8; }
</style>
</head>
<body>
  <div class="card">
    <h1>付款收据</h1>
    <div class="meta">订单 ORD-20481 · 2026-11-25</div>
    <table>
      <thead><tr><th>项目</th><th>数量</th><th>金额</th></tr></thead>
      <tbody>
        <tr><td>Pro 月度订阅</td><td>1</td><td>$29.00</td></tr>
        <tr><td>额外交付次数</td><td>12</td><td>$6.00</td></tr>
        <tr><td>退款（11-18 重复扣款）</td><td>1</td><td>-$29.00</td></tr>
        <tr class="total"><td>合计</td><td></td><td>$6.00</td></tr>
      </tbody>
    </table>
    <div class="actions"><a class="btn" href="#">下载 PDF</a></div>
  </div>
</body>
</html>
