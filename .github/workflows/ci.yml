name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install test dependencies
        run: python -m pip install --quiet pytest -r requirements.txt
      - name: Run tests
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        # `-rP` surfaces the passing Stripe check's captured log line
        # (payment intent id + amount) in the public job log.
        run: python -m pytest -q -rP
